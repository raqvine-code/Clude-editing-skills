<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koi Pond</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="painting" width="1080" height="1920"></canvas>
<script>
(() => {
'use strict';

/* =====================================================================
   Koi pond in watercolour — everything painted with Canvas 2D + pixel
   maths. Pigment is tracked as optical density (Beer–Lambert), so washes
   glaze subtractively like transparent watercolour on paper.
   ===================================================================== */

const W = 1080, H = 1920;
const SEED = 4417;
const TAU = Math.PI * 2;
const PAPER = [247, 242, 231];

const canvas = document.getElementById('painting');
const ctx = canvas.getContext('2d');

function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fit);
fit();

/* ---------------- seeded randomness ---------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
// every element gets its own stream, so it repaints identically on its own
function makeRng(name) {
  const f = mulberry32((Math.imul(SEED, 2654435761) ^ hashStr(name)) >>> 0);
  const r = () => f();
  r.range = (a, b) => a + (b - a) * f();
  r.gauss = () => { let u = 0; while (u === 0) u = f(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * f()); };
  r.chance = p => f() < p;
  return r;
}

/* ---------------- noise ---------------- */
const GRAD = new Float32Array(32);
for (let i = 0; i < 16; i++) { const a = i / 16 * TAU + 0.13; GRAD[i * 2] = Math.cos(a); GRAD[i * 2 + 1] = Math.sin(a); }
function ih(x, y, s) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s ^ SEED, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}
function gnoise(x, y, s) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10), v = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
  let h = (ih(ix, iy, s) & 15) << 1;           const n00 = GRAD[h] * fx + GRAD[h + 1] * fy;
  h = (ih(ix + 1, iy, s) & 15) << 1;           const n10 = GRAD[h] * (fx - 1) + GRAD[h + 1] * fy;
  h = (ih(ix, iy + 1, s) & 15) << 1;           const n01 = GRAD[h] * fx + GRAD[h + 1] * (fy - 1);
  h = (ih(ix + 1, iy + 1, s) & 15) << 1;       const n11 = GRAD[h] * (fx - 1) + GRAD[h + 1] * (fy - 1);
  const a = n00 + (n10 - n00) * u, b = n01 + (n11 - n01) * u;
  return (a + (b - a) * v) * 1.45;
}
function fbm(x, y, oct, s) {
  let sum = 0, amp = 1, norm = 0;
  for (let i = 0; i < oct; i++) { sum += amp * gnoise(x, y, s + i * 101); norm += amp; amp *= 0.5; x *= 2.03; y *= 2.03; }
  return sum / norm;
}
// smooth noise field over a box, sampled coarse and interpolated
function lowNoise(x0, y0, bw, bh, scale, seed, oct) {
  const step = Math.max(3, Math.round(scale / 7));
  const gw = Math.floor(bw / step) + 2, gh = Math.floor(bh / step) + 2;
  const G = new Float32Array(gw * gh);
  for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) G[j * gw + i] = fbm((x0 + i * step) / scale, (y0 + j * step) / scale, oct, seed);
  const out = new Float32Array(bw * bh);
  for (let yy = 0; yy < bh; yy++) {
    const fy = yy / step, j = fy | 0, ty = fy - j;
    for (let xx = 0; xx < bw; xx++) {
      const fx = xx / step, i = fx | 0, tx = fx - i;
      const a = G[j * gw + i], b = G[j * gw + i + 1], c = G[(j + 1) * gw + i], d = G[(j + 1) * gw + i + 1];
      const top = a + (b - a) * tx, bot = c + (d - c) * tx;
      out[yy * bw + xx] = top + (bot - top) * ty;
    }
  }
  return out;
}

/* ---------------- paper: cold-press tooth ---------------- */
const PH = new Float32Array(W * H);   // paper height 0..1
const FL = new Float32Array(W * H);   // pigment flocculation / clumping
function buildPaper() {
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const n1 = gnoise(x / 6.3, y / 6.3, 11);
      const n2 = gnoise(x / 2.5, y / 2.5, 12);
      const n3 = gnoise(x / 17, y / 17, 13);
      let h = 0.5 + 0.5 * (0.5 * n1 + 0.24 * n2 + 0.26 * n3);
      PH[i] = h < 0 ? 0 : h > 1 ? 1 : h;
      const wn = (ih(x, y, 991) & 1023) / 1023;
      FL[i] = 0.5 + 0.3 * gnoise(x / 1.9, y / 1.9, 14) + 0.28 * (wn - 0.5);
    }
  }
}
const wrapX = x => ((x % W) + W) % W;
const wrapY = y => ((y % H) + H) % H;

/* ---------------- pigments (absorbance per unit density) ---------------- */
const pig = (r, g, b) => [-Math.log(r / 255), -Math.log(g / 255), -Math.log(b / 255)];
const mix = (...parts) => { const a = [0, 0, 0]; for (const [p, w] of parts) { a[0] += p[0] * w; a[1] += p[1] * w; a[2] += p[2] * w; } return a; };
const PG = {
  turq:     pig(30, 150, 155),   // phthalo turquoise
  indigo:   pig(45, 60, 100),    // indigo
  sap:      pig(125, 165, 50),   // sap green
  scarlet:  pig(222, 52, 40),    // scarlet / cadmium red
  crimson:  pig(160, 25, 55),    // alizarin
  orange:   pig(246, 142, 36),   // cadmium orange
  rose:     pig(226, 96, 150),   // quinacridone rose
  graphite: pig(150, 150, 158)   // pencil
};
const INK = {
  pond:     mix([PG.turq, 0.9], [PG.indigo, 0.1], [PG.sap, 0.1]),
  deep:     mix([PG.turq, 0.85], [PG.indigo, 0.45], [PG.sap, 0.08]),
  shadow:   mix([PG.turq, 0.55], [PG.indigo, 0.65], [PG.crimson, 0.05]),
  shade:    mix([PG.indigo, 0.7], [PG.orange, 0.22], [PG.turq, 0.2]),
  stone:    mix([PG.indigo, 0.6], [PG.orange, 0.28], [PG.turq, 0.35]),
  leaf:     mix([PG.sap, 1], [PG.turq, 0.16]),
  leafDark: mix([PG.sap, 0.8], [PG.indigo, 0.55]),
  redK:     mix([PG.scarlet, 1], [PG.crimson, 0.12]),
  redDark:  mix([PG.crimson, 0.9], [PG.scarlet, 0.4], [PG.indigo, 0.12]),
  orange:   mix([PG.orange, 1], [PG.scarlet, 0.06]),
  orangeDk: mix([PG.orange, 0.8], [PG.scarlet, 0.45], [PG.indigo, 0.05]),
  gold:     mix([PG.orange, 1], [PG.sap, 0.35]),
  rust:     mix([PG.orange, 0.8], [PG.scarlet, 0.35], [PG.sap, 0.2]),
  rose:     PG.rose,
  roseDeep: mix([PG.rose, 1], [PG.crimson, 0.25]),
  eye:      mix([PG.indigo, 0.8], [PG.crimson, 0.6]),
  graphite: PG.graphite
};

/* ---------------- layers ---------------- */
// 'multiply' layers hold glazes that darken what is beneath.
// 'paint' layers are reserved paper (alpha mask M) with pigment on it.
function Layer(x, y, w, h, kind) {
  this.x = Math.floor(x); this.y = Math.floor(y);
  this.w = Math.ceil(w); this.h = Math.ceil(h);
  this.kind = kind;
  this.A = new Float32Array(this.w * this.h * 3);
  this.M = kind === 'paint' ? new Float32Array(this.w * this.h) : null;
  this.canvas = null;
}
function layerToCanvas(L) {
  if (L.canvas) return L.canvas;
  const c = document.createElement('canvas'); c.width = L.w; c.height = L.h;
  const x = c.getContext('2d');
  const id = x.createImageData(L.w, L.h), d = id.data, A = L.A;
  const isPaint = L.kind === 'paint';
  const b0 = isPaint ? PAPER[0] : 255, b1 = isPaint ? PAPER[1] : 255, b2 = isPaint ? PAPER[2] : 255;
  for (let i = 0, j = 0, k = 0, n = L.w * L.h; i < n; i++, j += 4, k += 3) {
    d[j] = b0 * Math.exp(-A[k]); d[j + 1] = b1 * Math.exp(-A[k + 1]); d[j + 2] = b2 * Math.exp(-A[k + 2]);
    d[j + 3] = isPaint ? L.M[i] * 255 : 255;
  }
  x.putImageData(id, 0, 0);
  L.canvas = c;
  return c;
}
function layerMask(L, r) {
  const m = new Float32Array(L.w * L.h);
  if (!r) return m;
  for (let yy = 0; yy < r.bh; yy++) {
    const li = (r.y0 - L.y + yy) * L.w + (r.x0 - L.x);
    for (let xx = 0; xx < r.bw; xx++) m[li + xx] = r.C[yy * r.bw + xx];
  }
  return m;
}

/* ---------------- raster helpers ---------------- */
const scratch = document.createElement('canvas');
scratch.width = W; scratch.height = H;
const sctx = scratch.getContext('2d', { willReadFrequently: true });

function raster(x0, y0, bw, bh, draw) {
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.globalCompositeOperation = 'source-over';
  sctx.globalAlpha = 1;
  sctx.clearRect(0, 0, bw + 2, bh + 2);
  sctx.setTransform(1, 0, 0, 1, -x0, -y0);
  draw(sctx);
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.globalCompositeOperation = 'source-over';
  const d = sctx.getImageData(0, 0, bw, bh).data;
  const C = new Float32Array(bw * bh);
  for (let i = 0, j = 3; i < C.length; i++, j += 4) C[i] = d[j] * (1 / 255);
  return C;
}
function fillPath(c, P) {
  c.beginPath(); c.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length; i++) c.lineTo(P[i][0], P[i][1]);
  c.closePath(); c.fill();
}
function bboxPts(list) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const P of list) for (const p of P) {
    if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
    if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
  }
  return [x0, y0, x1, y1];
}
function boxPass(src, w, h, r) {
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h), inv = 1 / (2 * r + 1);
  for (let y = 0; y < h; y++) {
    const o = y * w; let acc = 0;
    for (let i = -r; i <= r; i++) acc += src[o + (i < 0 ? 0 : i >= w ? w - 1 : i)];
    for (let x = 0; x < w; x++) {
      tmp[o + x] = acc * inv;
      const xa = x - r, xb = x + r + 1;
      acc += src[o + (xb >= w ? w - 1 : xb)] - src[o + (xa < 0 ? 0 : xa)];
    }
  }
  for (let x = 0; x < w; x++) {
    let acc = 0;
    for (let i = -r; i <= r; i++) acc += tmp[(i < 0 ? 0 : i >= h ? h - 1 : i) * w + x];
    for (let y = 0; y < h; y++) {
      out[y * w + x] = acc * inv;
      const ya = y - r, yb = y + r + 1;
      acc += tmp[(yb >= h ? h - 1 : yb) * w + x] - tmp[(ya < 0 ? 0 : ya) * w + x];
    }
  }
  return out;
}
function blurArr(src, w, h, r) {
  r = Math.max(1, Math.round(r / 2));
  return boxPass(boxPass(src, w, h, r), w, h, r);
}

/* ---------------- hand-made shapes ---------------- */
// recursive midpoint displacement: each vertex carries its own wobbliness
function deformPoly(pts, depth, amt, rng) {
  let p = pts;
  for (let d = 0; d < depth; d++) {
    const q = [], n = p.length;
    for (let i = 0; i < n; i++) {
      const a = p[i], b = p[(i + 1) % n];
      q.push(a);
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const len = Math.sqrt(dx * dx + dy * dy), v = (a[2] + b[2]) * 0.5, s = len * amt * v;
      q.push([(a[0] + b[0]) * 0.5 + rng.gauss() * s, (a[1] + b[1]) * 0.5 + rng.gauss() * s, v * (0.8 + rng() * 0.4)]);
    }
    p = q;
  }
  return p;
}
function prepPoly(pts, rng, vmin, vmax) { return pts.map(p => [p[0], p[1], vmin + (vmax - vmin) * rng()]); }
// a wash shape: many slightly different translucent passes stacked
function layered(pts, rng, o = {}) {
  const base = deformPoly(prepPoly(pts, rng, o.vmin ?? 0.4, o.vmax ?? 1.4), o.d0 ?? 2, o.a0 ?? 0.08, rng);
  const n = o.layers ?? 10, polys = [];
  for (let k = 0; k < n; k++) polys.push(deformPoly(base, o.d1 ?? 2, o.a1 ?? 0.06, rng));
  return {
    bbox: bboxPts(polys),
    draw: c => {
      c.globalCompositeOperation = 'lighter';
      c.fillStyle = 'rgba(255,255,255,' + (1 / n) + ')';
      for (const P of polys) fillPath(c, P);
      c.globalCompositeOperation = 'source-over';
    }
  };
}
function polysShape(polys) {
  return { bbox: bboxPts(polys), draw: c => { c.fillStyle = '#fff'; for (const P of polys) fillPath(c, P); } };
}
function blobPoly(cx, cy, rx, ry, rot, n, rng, irr = 0.2) {
  const pts = [], ph = rng() * 50, c = Math.cos(rot), s = Math.sin(rot);
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    const r = 1 + irr * gnoise(Math.cos(a) * 1.2 + ph, Math.sin(a) * 1.2 + ph, 17);
    const x = Math.cos(a) * rx * r, y = Math.sin(a) * ry * r;
    pts.push([cx + x * c - y * s, cy + x * s + y * c]);
  }
  return pts;
}
function cauliflower(x, y, R, rng) {
  // a back-run: lobed outline whose rim breaks into fine frills
  const n = 40, pts = [], lobes = 5 + Math.floor(rng() * 5), ph = rng() * TAU;
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    const r = R * (0.78 + 0.16 * Math.abs(Math.sin(a * lobes * 0.5 + ph)) + 0.12 * rng());
    pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r * 0.85]);
  }
  return deformPoly(deformPoly(prepPoly(pts, rng, 0.5, 1.3), 2, 0.12, rng), 2, 0.22, rng);
}
// a brush stroke following a path, swelling and tapering
function taperPoly(pts, w0, w1, tin = 0.15, tout = 0.35) {
  const n = pts.length, Lp = [], Rp = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    const t = i / (n - 1);
    const w = (w0 + (w1 - w0) * t) * 0.5 * Math.min(1, (t + 0.04) / tin, (1 - t + 0.04) / tout);
    Lp.push([pts[i][0] - ty * w, pts[i][1] + tx * w]);
    Rp.push([pts[i][0] + ty * w, pts[i][1] - tx * w]);
  }
  return Lp.concat(Rp.reverse());
}
function lens(x, y, len, th, ang) {
  const pts = [], c = Math.cos(ang), s = Math.sin(ang);
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * TAU, px = Math.cos(a) * len / 2, py = Math.sin(a) * th / 2;
    pts.push([x + px * c - py * s, y + px * s + py * c]);
  }
  return pts;
}

/* ---------------- the brush: lay a wash into a layer ----------------
   o.shape   {bbox, draw}  coverage drawn in white
   o.pig     absorbance vector, o.density
   o.hard    0 = wet-in-wet soft edge, 1 = hard dried edge
   o.edge    dark rim where pigment migrated to the drying edge
   o.pool    broader pooling inside the edge
   o.vary    uneven pigment load, o.gran granulation into paper tooth
   o.blooms  back-runs (cauliflowers), o.dry dry-brush on paper peaks
   o.lift    lift pigment out with a damp brush instead of adding
   o.clip / o.exclude   masks over the layer, o.toMask writes reserve      */
function paint(L, o) {
  const sh = o.shape;
  const m = Math.ceil(Math.max(o.edge ? (o.edgeR ?? 4) * 2 : 0, o.pool ? (o.poolR ?? 18) * 1.5 : 0, 6) + (o.margin ?? 0) + (o.soften ?? 0) * 2);
  const x0 = Math.max(L.x, Math.floor(sh.bbox[0]) - m), y0 = Math.max(L.y, Math.floor(sh.bbox[1]) - m);
  const x1 = Math.min(L.x + L.w, Math.ceil(sh.bbox[2]) + m), y1 = Math.min(L.y + L.h, Math.ceil(sh.bbox[3]) + m);
  const bw = x1 - x0, bh = y1 - y0;
  if (bw <= 2 || bh <= 2) return null;
  const C = raster(x0, y0, bw, bh, sh.draw);
  return applyCov(L, x0, y0, bw, bh, C, o);
}
function applyCov(L, x0, y0, bw, bh, C, o) {
  const n = bw * bh;
  // wet paper: the charge diffuses outward before it settles
  if (o.soften) { const S = blurArr(C, bw, bh, o.soften); for (let i = 0; i < n; i++) C[i] = Math.min(1, S[i] * (0.75 + 0.5 * C[i])); }
  const hard = o.hard ?? 0.6;
  if (hard > 0) {
    const lo = o.lo ?? 0.3, hi = o.hi ?? 0.52, k = 1 / (hi - lo);
    for (let i = 0; i < n; i++) {
      const c = C[i]; if (c === 0) continue;
      let t = (c - lo) * k; t = t < 0 ? 0 : t > 1 ? 1 : t; t = t * t * (3 - 2 * t);
      C[i] = c + (t - c) * hard;
    }
  }
  if (o.clip || o.exclude) {
    const cl = o.clip, ex = o.exclude;
    for (let yy = 0; yy < bh; yy++) {
      const li = (y0 - L.y + yy) * L.w + (x0 - L.x), ci = yy * bw;
      for (let xx = 0; xx < bw; xx++) {
        let c = C[ci + xx]; if (c === 0) continue;
        if (cl) c *= cl[li + xx];
        if (ex) c *= 1 - ex[li + xx];
        C[ci + xx] = c;
      }
    }
  }
  if (o.dry) {
    const soft = o.drySoft ?? 0.09, t0 = o.dry - soft, k = 1 / (2 * soft);
    for (let yy = 0; yy < bh; yy++) {
      const row = wrapY(y0 + yy) * W; let px = wrapX(x0);
      for (let xx = 0; xx < bw; xx++, px = px + 1 === W ? 0 : px + 1) {
        const i = yy * bw + xx; if (C[i] === 0) continue;
        const pi = row + px;
        let t = (PH[pi] + 0.35 * (FL[pi] - 0.5) - t0) * k; t = t < 0 ? 0 : t > 1 ? 1 : t;
        C[i] *= t;
      }
    }
  }
  if (o.toMask) {
    const a = o.toMask, M = L.M;
    for (let yy = 0; yy < bh; yy++) {
      const li = (y0 - L.y + yy) * L.w + (x0 - L.x);
      for (let xx = 0; xx < bw; xx++) { const v = C[yy * bw + xx] * a; if (v > M[li + xx]) M[li + xx] = v; }
    }
    if (!o.pig && !o.lift) return { x0, y0, bw, bh, C };
  }
  const E = o.edge || o.lift ? blurArr(C, bw, bh, o.edgeR ?? 4) : null;
  const P = o.pool ? blurArr(C, bw, bh, o.poolR ?? 18) : null;
  const V = o.vary ? lowNoise(x0, y0, bw, bh, o.varyScale ?? 90, o.seed ?? 1, 3) : null;
  let Bm = null, Bs = null;
  if (o.blooms && o.rng) {
    const rng = o.rng, shapes = [];
    if (o.bloomAt) for (const [bx, by, R] of o.bloomAt) shapes.push(cauliflower(bx, by, R, rng));
    else for (let b = 0; b < o.blooms; b++) {
      for (let t = 0; t < 80; t++) {
        const xx = (rng() * bw) | 0, yy = (rng() * bh) | 0;
        if (C[yy * bw + xx] > 0.85) { shapes.push(cauliflower(x0 + xx, y0 + yy, rng.range(o.bloomR[0], o.bloomR[1]), rng)); break; }
      }
    }
    if (shapes.length) {
      Bm = raster(x0, y0, bw, bh, c => { c.fillStyle = '#fff'; for (const S of shapes) fillPath(c, S); });
      Bs = blurArr(Bm, bw, bh, o.bloomEdge ?? 5);
    }
  }
  const A = L.A, d0 = o.density ?? 0.5, gran = o.gran ?? 0.3, pg = o.pig;
  const edge = o.edge || 0, pool = o.pool || 0, vary = o.vary || 0;
  const bl = o.bloomLift ?? 0.55, br = o.bloomRim ?? 1.3, lift = o.lift || 0, liftRim = o.liftRim ?? 0.5;
  for (let yy = 0; yy < bh; yy++) {

  const L = new Layer(cx - R - 50, cy - R - 50, 2 * R + 100, 2 * R + 100, 'paint');
  const occ = new Float32Array(L.w * L.h);
  const addOcc = r => { if (!r) return; for (let yy = 0; yy < r.bh; yy++) { const li = (r.y0 - L.y + yy) * L.w + (r.x0 - L.x); for (let xx = 0; xx < r.bw; xx++) { const v = r.C[yy * r.bw + xx]; if (v > occ[li + xx]) occ[li + xx] = v; } } };
  const gap = () => { const b = blurArr(occ, L.w, L.h, 3); for (let i = 0; i < b.length; i++) b[i] = Math.min(1, b[i] * 1.9); return b; };

  // seed head and stamens sit on top, so they are painted first and the petals go around them
  const rr = R * 0.17;
  const pod = paint(L, { shape: layered(blobPoly(cx, cy, rr, rr * 0.95, 0, 16, rng, 0.08), rng, { layers: 8, d0: 1, a0: 0.04, d1: 1, a1: 0.05 }), toMask: 1, pig: INK.gold, density: 0.42, hard: 0.95, edge: 0.9, edgeR: 3, vary: 0.4, varyScale: 14, seed: 501, gran: 0.3 });
  addOcc(pod);
  const holes = [[0, 0], ...Array.from({ length: 6 }, (_, i) => [Math.cos(i / 6 * TAU + 0.3) * rr * 0.55, Math.sin(i / 6 * TAU + 0.3) * rr * 0.55])];
  paint(L, { shape: polysShape(holes.map(([hx, hy]) => blobPoly(cx + hx, cy + hy, rr * 0.13, rr * 0.13, 0, 8, rng, 0.15))), pig: mix([PG.sap, 0.7], [PG.orange, 0.5], [PG.indigo, 0.25]), density: 0.55, hard: 0.9, edge: 0.5, edgeR: 2, gran: 0.2 });
  const stamens = [];
  for (let i = 0; i < 46; i++) {
    const a = i / 46 * TAU + rng.gauss() * 0.05, r1 = rr * 1.02, r2 = rr * rng.range(1.55, 2.0), bend = rng.gauss() * 0.12;
    stamens.push([[cx + Math.cos(a) * r1, cy + Math.sin(a) * r1], [cx + Math.cos(a + bend) * r2, cy + Math.sin(a + bend) * r2]]);
  }
  const st = paint(L, {
    shape: { bbox: [cx - rr * 2.1, cy - rr * 2.1, cx + rr * 2.1, cy + rr * 2.1], draw: c => { c.strokeStyle = '#fff'; c.lineCap = 'round'; for (const [a, b] of stamens) { c.lineWidth = rng.range(1.3, 2.4); c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke(); c.beginPath(); c.arc(b[0], b[1], 1.8, 0, TAU); c.fill(); } } },
    toMask: 1, pig: INK.gold, density: 0.5, hard: 0.7, gran: 0.25
  });
  addOcc(st);

  // petals, innermost first: each new one is painted around those already down
  const rings = [
    { n: 5, len: 0.5, wid: 0.62, r0: 0.1, rot: 0.4, d: 0.2, tip: 0.36 },
    { n: 7, len: 0.76, wid: 0.5, r0: 0.12, rot: 0.4 + Math.PI / 7, d: 0.15, tip: 0.3 },
    { n: 10, len: 1.0, wid: 0.44, r0: 0.14, rot: 0.1, d: 0.11, tip: 0.26 }
  ];
  const outerPolys = [];
  rings.forEach((g, gi) => {
    for (let i = 0; i < g.n; i++) {
      const a = g.rot + i / g.n * TAU + rng.gauss() * 0.1, len = g.len * R * rng.range(0.84, 1.1);
      const poly = petalPoly(cx, cy, a, g.r0 * R, len, g.wid * len * rng.range(0.85, 1.12), rng.gauss() * 0.07);
      if (gi === 2) outerPolys.push(poly);
      const petal = layered(poly, rng, { layers: 8, d0: 2, a0: 0.04, d1: 1, a1: 0.05 });
      paint(L, { shape: petal, hard: 0.95, toMask: 1 });   // the whole flower stays reserved paper
      const r = paint(L, {
        shape: petal, exclude: gap(),
        pig: INK.rose, density: g.d * rng.range(0.8, 1.2), hard: 0.9, edge: 1.2, edgeR: 3, pool: 0.5, poolR: 10, vary: 0.5, varyScale: 22, seed: 510 + gi * 20 + i, gran: 0.15
      });
      if (!r) continue;
      const pm = layerMask(L, r);
      const tx = cx + Math.cos(a) * (g.r0 * R + len * 0.95), ty = cy + Math.sin(a) * (g.r0 * R + len * 0.95);
      paint(L, { shape: layered(blobPoly(tx, ty, len * 0.34, len * 0.22 * g.wid / 0.4, a, 12, rng, 0.35), rng, { layers: 12, d0: 2, a0: 0.12, d1: 2, a1: 0.12 }), clip: pm, pig: INK.roseDeep, density: g.tip, hard: 0, soften: 9, vary: 0.5, varyScale: 18, seed: 560 + gi * 20 + i, gran: 0.2 });
      // a breath of yellow-green where the petal meets the heart
      const bx = cx + Math.cos(a) * (g.r0 * R + len * 0.12), by = cy + Math.sin(a) * (g.r0 * R + len * 0.12);
      paint(L, { shape: layered(blobPoly(bx, by, len * 0.2, len * 0.14, a, 10, rng, 0.3), rng, { layers: 10, d0: 2, a0: 0.12, d1: 2, a1: 0.12 }), clip: pm, pig: INK.gold, density: 0.07, hard: 0, soften: 6, gran: 0.2 });
      const vs = [];
      for (let j = -1; j <= 1; j++) { const pts = []; for (let t = 0.15; t <= 0.85; t += 0.1) { const off = j * g.wid * len * 0.17 * Math.sin(Math.PI * t); pts.push([cx + Math.cos(a) * (g.r0 * R + t * len) - Math.sin(a) * off, cy + Math.sin(a) * (g.r0 * R + t * len) + Math.cos(a) * off]); } vs.push(pts); }
      paint(L, { shape: { bbox: bboxPts([poly]), draw: c => { c.strokeStyle = '#fff'; c.lineWidth = 1; for (const v of vs) { c.beginPath(); c.moveTo(v[0][0], v[0][1]); for (const q of v) c.lineTo(q[0], q[1]); c.stroke(); } } }, clip: pm, pig: INK.rose, density: 0.16, hard: 0.3, dry: 0.4, gran: 0.2 });
      addOcc(r);
    }
  });

  const off = P => P.map(q => [q[0] + 40, q[1] + 52]);
  const sp = outerPolys.map(off), sb = bboxPts(sp);
  const S = new Layer(sb[0] - 50, sb[1] - 50, sb[2] - sb[0] + 100, sb[3] - sb[1] + 100, 'multiply');
  for (const P of sp) paint(S, { shape: layered(P, rng, { layers: 8, d0: 2, a0: 0.05, d1: 2, a1: 0.1 }), pig: INK.shadow, density: 0.16, hard: 0.2, gran: 0.6 });
  return { shadow: S, rim: rimLayer(L, 0.6, INK.deep, 599, 3), body: L };
}

/* =====================================================================
   BACKGROUND — depth layer 3: the water surface (over the fish)
   ===================================================================== */
function drawWaterSurface(withRings = true) {
  const L = new Layer(0, 0, W, H, 'multiply'), rng = makeRng('surface');
  for (let i = 0; i < 12; i++) {
    const y0 = rng.range(120, H - 120), x0 = rng.range(-120, W - 260), len = rng.range(240, 620);
    const amp = rng.range(3, 9), f = rng.range(0.008, 0.02), ph = rng() * TAU, tilt = rng.range(-0.08, 0.06);
    const pts = [];
    for (let t = 0; t <= 1.0001; t += 1 / 40) { const x = x0 + t * len; pts.push([x, y0 + Math.sin(x * f + ph) * amp + tilt * t * len]); }
    paint(L, { shape: layered(taperPoly(pts, rng.range(2.5, 4.5), rng.range(1.5, 2.5), 0.3, 0.4), rng, { layers: 4, d0: 1, a0: 0.05, d1: 1, a1: 0.06 }), pig: INK.deep, density: rng.range(0.14, 0.24), hard: 0.6, edge: 0.4, edgeR: 2, dry: 0.34, gran: 0.4 });
  }
  // rings spreading where a fish nudged the surface
  for (const [x, y, n] of withRings ? [[196, 500, 3], [915, 1262, 3]] : []) {
    let a0 = rng() * TAU;
    for (let k = 0; k < n; k++) {
      const r = 30 + k * 26 + rng.gauss() * 3, arcs = [];
      let a = a0 + rng.gauss() * 0.4;
      while (a < a0 + TAU) {
        const span = rng.range(0.4, 1.2), pts = [];
        for (let t = 0; t <= 1.0001; t += 0.05) { const aa = a + span * t; pts.push([x + Math.cos(aa) * r, y + Math.sin(aa) * r * 0.92]); }
        arcs.push(pts); a += span + rng.range(0.25, 0.7);
        if (arcs.length > 6) break;
      }
      for (const P of arcs) paint(L, { shape: layered(taperPoly(P, 3.2 - k * 0.5, 2.6 - k * 0.4, 0.3, 0.3), rng, { layers: 3, d0: 1, a0: 0.04, d1: 1, a1: 0.05 }), pig: INK.deep, density: 0.3 - k * 0.05, hard: 0.7, edge: 0.5, edgeR: 2, dry: 0.3, gran: 0.4 });
    }
  }
  return L;
}

/* =====================================================================
   SPLATTERS — flicked from a loaded brush
   ===================================================================== */
function drawSplatters() {
  const L = new Layer(0, 0, W, H, 'multiply'), rng = makeRng('splatter');
  const drops = [];
  const sprays = [[110, 1330, -0.7, 7, INK.deep], [560, 120, 2.6, 5, INK.deep], [720, 1590, -0.3, 4, INK.redK], [300, 860, 0.9, 4, INK.orange], [980, 1800, 3.6, 4, INK.leafDark]];
  for (const [x, y, a, n, ink] of sprays) {
    for (let i = 0; i < n; i++) {
      const d = i * rng.range(16, 34), r = Math.max(1.3, 6.5 - i * 0.9 + rng.gauss() * 1.2);
      drops.push([x + Math.cos(a) * d + rng.gauss() * 8, y + Math.sin(a) * d + rng.gauss() * 8, r, a, rng() < 0.4 ? 1.8 : 1.1, ink]);
    }
  }
  for (let i = 0; i < 7; i++) drops.push([rng.range(40, W - 40), rng.range(40, H - 40), rng.range(1.4, 3.5), rng() * TAU, 1.1, rng() < 0.7 ? INK.deep : INK.redK]);
  for (const [x, y, r, a, el, ink] of drops) {
    const poly = blobPoly(x, y, r * el, r, a, 14, rng, 0.12);
    paint(L, { shape: layered(poly, rng, { layers: 4, d0: 1, a0: 0.12, d1: 1, a1: 0.1 }), pig: ink, density: rng.range(0.3, 0.55), hard: 1, edge: 1.6, edgeR: Math.max(2, r * 0.5), gran: 0.25 });
  }
  return L;
}

/* =====================================================================
   PAPER GRAIN — the tooth of cold-press paper catching side light
   ===================================================================== */
let grainCanvases = null;
function drawPaperGrain(c) {
  if (!grainCanvases) {
    const mul = document.createElement('canvas'), scr = document.createElement('canvas');
    mul.width = scr.width = W; mul.height = scr.height = H;
    const mi = new ImageData(W, H), si = new ImageData(W, H), md = mi.data, sd = si.data;
    const cockle = lowNoise(0, 0, W, H, 420, 777, 2);
    for (let y = 0; y < H; y++) {
      const ya = y > 0 ? y - 1 : 0, yb = y < H - 1 ? y + 1 : y;
      for (let x = 0; x < W; x++) {
        const i = y * W + x, xa = x > 0 ? x - 1 : 0, xb = x < W - 1 ? x + 1 : x;
        const lit = (PH[yb * W + xb] - PH[ya * W + xa]) * 6.5;
        const shade = lit < 0 ? Math.min(1, -lit) : 0, hi = lit > 0 ? Math.min(1, lit) : 0;
        const valley = PH[i] < 0.5 ? (0.5 - PH[i]) * 2 : 0;
        const m = 1 - 0.085 * shade - 0.035 * valley - 0.012 * (0.5 + 0.5 * cockle[i]);
        const j = i * 4;
        md[j] = md[j + 1] = md[j + 2] = 255 * m; md[j + 3] = 255;
        sd[j] = sd[j + 1] = sd[j + 2] = 255 * 0.06 * hi; sd[j + 3] = 255;
      }
    }
    mul.getContext('2d').putImageData(mi, 0, 0);
    scr.getContext('2d').putImageData(si, 0, 0);
    grainCanvases = { mul, scr };
  }
  c.globalCompositeOperation = 'multiply'; c.drawImage(grainCanvases.mul, 0, 0);
  c.globalCompositeOperation = 'screen'; c.drawImage(grainCanvases.scr, 0, 0);
  c.globalCompositeOperation = 'source-over';
}

/* =====================================================================
   ANIMATION — a seamless loop, painted frame by frame for video
   (open the page with #video, then call koiVideo.render(i) for each frame)
   ===================================================================== */
const LOOP = 16, FPS = 30;          // seconds per loop, frames per second
const ORIGIN = [800, 600];          // where a moving koi is painted, head facing +x
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };

// the route the red and orange koi swim, circling the kohaku anticlockwise
const ROUTE = (() => {
  const cx = 540, cy = 965, a = 335, b = 515, n = 4000, pts = [], cum = [0];
  for (let i = 0; i <= n; i++) {
    const ph = 1.5 * Math.PI - i / n * TAU;
    const r = 1 + 0.05 * Math.sin(2 * ph + 1.1) + 0.03 * Math.sin(3 * ph + 0.4);
    pts.push([cx + Math.cos(ph) * a * r, cy + Math.sin(ph) * b * r]);
  }
  for (let i = 1; i <= n; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const len = cum[n];
  return {
    len,
    at(sig) {
      sig = ((sig % len) + len) % len;
      let lo = 0, hi = n;
      while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= sig) lo = mid; else hi = mid; }
      const t = (sig - cum[lo]) / (cum[hi] - cum[lo] || 1), p = pts[lo], q = pts[hi];
      return [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t, Math.atan2(q[1] - p[1], q[0] - p[0])];
    }
  };
})();
// a travelling wave down the body: stronger toward the tail, whole cycles per loop
const swimWave = (s, t, amp, cycles, ph) => amp * Math.pow(s, 1.6) * Math.sin(TAU * cycles * t / LOOP - 2.3 * Math.PI * s + ph);

// the main subject hovers in the middle of the pond, swaying and sculling its fins
function kohakuPose(t) {
  const u = TAU * t / LOOP, h = -1.78 + 0.07 * Math.sin(u + 1.0);
  const fwd = 22 * Math.sin(u), side = 14 * Math.sin(2 * u + 0.6);
  return {
    x: 600 + Math.cos(h) * fwd - Math.sin(h) * side, y: 745 + Math.sin(h) * fwd + Math.cos(h) * side, th: h,
    theta: s => 0.75 * s - 0.25 * s * s + swimWave(s, t, 0.15, 8, 0),
    pec: [1.1 + 0.16 * Math.sin(6 * u), 0.9 + 0.16 * Math.sin(6 * u + 2.4)],
    pel: [0.72 + 0.07 * Math.sin(6 * u + 1), 0.6 + 0.07 * Math.sin(6 * u + 3)]
  };
}
// the other two follow the route, half a lap apart, one lap per loop
function routePose(spec, sig0, t, cycles, ph) {
  const u = TAU * t / LOOP, sig = sig0 + ROUTE.len * t / LOOP, [x, y, th] = ROUTE.at(sig);
  return {
    x, y, th,
    theta: s => angDiff(ROUTE.at(sig - s * spec.len)[2], th) + swimWave(s, t, 0.19, cycles, ph),
    pec: [spec.pecAng[0] - 0.1 + 0.12 * Math.sin(cycles * u + ph), spec.pecAng[1] - 0.1 + 0.12 * Math.sin(cycles * u + ph + 2.6)],
    pel: spec.pelAng
  };
}
// paint a koi in its own frame (so its pigment travels with it) and remember where it goes
function paintKoiPosed(name, spec, pose) {
  const c = Math.cos(pose.th), sn = Math.sin(pose.th), toLocal = ([x, y]) => [x * c + y * sn, -x * sn + y * c];
  const g = paintKoi(name, Object.assign({}, spec, {
    x: ORIGIN[0], y: ORIGIN[1], heading: 0, thetaFn: pose.theta, pecAng: pose.pec, pelAng: pose.pel,
    light: toLocal([-0.62, -0.78]), shadowOff: toLocal([26 * spec.depth, 38 * spec.depth]), smoothLight: true, fixedBlooms: true
  }));
  g.place = { x: pose.x, y: pose.y, th: pose.th, ox: ORIGIN[0], oy: ORIGIN[1] };
  return g;
}
// lily pads and the lotus ride the water a little
function floatPlace(x, y, i, t, amp = 1) {
  const u = TAU * t / LOOP + i * 1.7;
  return { x: x + 3 * amp * Math.sin(u), y: y + 2.5 * amp * Math.cos(u + 0.8), th: 0.012 * amp * Math.sin(u + 2.1), ox: x, oy: y };
}
// rings spreading from where something touched the surface
const RING_SOURCES = [[330, 700, 0.0], [805, 1250, 0.45], [640, 455, 0.72]];
function drawRipples(t) {
  const out = [], P = LOOP / 2, life = 5.2;
  RING_SOURCES.forEach(([x, y, off], si) => {
    const age = ((t + off * LOOP) % P + P) % P;
    if (age > life) return;
    const fade = Math.pow(1 - age / life, 1.3), R = 10 + 32 * age;
    const L = new Layer(x - R - 30, y - R - 30, 2 * R + 60, 2 * R + 60, 'multiply');
    for (let k = 0; k < 3; k++) {
      const r = R - k * 22;
      if (r < 6) continue;
      const rng = makeRng('ring-' + si + '-' + k);
      let a = rng() * TAU; const a0 = a, arcs = [];
      while (a < a0 + TAU && arcs.length < 7) {
        const span = rng.range(0.5, 1.3), pts = [];
        for (let q = 0; q <= 1.0001; q += 0.05) { const aa = a + span * q; pts.push([x + Math.cos(aa) * r, y + Math.sin(aa) * r * 0.93]); }
        arcs.push(pts); a += span + rng.range(0.25, 0.6);
      }
      for (const A of arcs) paint(L, { shape: layered(taperPoly(A, 3.4 - k * 0.6, 2.6 - k * 0.4, 0.3, 0.3), rng, { layers: 3, d0: 1, a0: 0.04, d1: 1, a1: 0.05 }), pig: INK.deep, density: (0.34 - k * 0.07) * fade, hard: 0.7, edge: 0.5, edgeR: 2, dry: 0.3, gran: 0.4 });
    }
    out.push(L);
  });
  return out;
}
function putAt(c, L, mode, pl) {
  if (!L) return;
  c.save();
  c.globalCompositeOperation = mode;
  c.imageSmoothingQuality = 'high';
  c.translate(pl.x, pl.y); c.rotate(pl.th); c.translate(-pl.ox, -pl.oy);
  c.drawImage(layerToCanvas(L), L.x, L.y);
  c.restore();
}
function renderFrame(scene, i) {
  const t = i / FPS;
  const koi = [
    drawRedKoi(routePose(RED_KOI, ROUTE.len * 0.06, t, 10, 0)),
    drawKohaku(kohakuPose(t)),
    drawOrangeKoi(routePose(ORANGE_KOI, ROUTE.len * 0.56, t, 10, 1.7))
  ];
  const rings = drawRipples(t);
  const padPl = PADS.map((p, j) => floatPlace(p.x, p.y, j, t));
  const lotusPl = floatPlace(858, 330, 3, t, 1.2);

  drawPaper(ctx);
  put(ctx, scene.pond, 'multiply');
  scene.pads.forEach((g, j) => putAt(ctx, g.shadow, 'multiply', padPl[j]));
  putAt(ctx, scene.lotus.shadow, 'multiply', lotusPl);
  for (const g of koi) putAt(ctx, g.shadow, 'multiply', g.place);
  for (const g of koi) { putAt(ctx, g.rim, 'multiply', g.place); putAt(ctx, g.body, 'source-over', g.place); }
  put(ctx, scene.surface, 'multiply');
  for (const L of rings) put(ctx, L, 'multiply');
  scene.pads.forEach((g, j) => { putAt(ctx, g.rim, 'multiply', padPl[j]); putAt(ctx, g.body, 'source-over', padPl[j]); });
  putAt(ctx, scene.lotus.rim, 'multiply', lotusPl); putAt(ctx, scene.lotus.body, 'source-over', lotusPl);
  put(ctx, scene.splatter, 'multiply');
  drawPaperGrain(ctx);
}

/* =====================================================================
   COMPOSE
   ===================================================================== */
function put(c, L, mode) {
  if (!L) return;
  c.globalCompositeOperation = mode;
  c.drawImage(layerToCanvas(L), L.x, L.y);
  c.globalCompositeOperation = 'source-over';
}
const tick = () => new Promise(r => setTimeout(r, 0));

async function main() {
  buildPaper(); await tick();
  const pond = new Layer(0, 0, W, H, 'multiply');
  drawPondFloor(pond); await tick();
  drawPondMidwater(pond); await tick();
  if (location.hash === '#video') {
    const scene = { pond, pads: drawLilyPads(), lotus: drawLotus(), surface: drawWaterSurface(false), splatter: drawSplatters() };
    window.koiVideo = { fps: FPS, frames: LOOP * FPS, render: i => renderFrame(scene, i) };
    renderFrame(scene, 0);
    document.body.dataset.done = '1';
    return;
  }
  const koi = [drawRedKoi(), drawKohaku(), drawOrangeKoi()]; await tick();
  const pads = drawLilyPads(); await tick();
  const lotus = drawLotus();
  const surface = drawWaterSurface();
  const splatter = drawSplatters(); await tick();

  drawPaper(ctx);
  put(ctx, pond, 'multiply');
  for (const g of [...pads, lotus, ...koi]) put(ctx, g.shadow, 'multiply');
  for (const g of koi) { put(ctx, g.rim, 'multiply'); put(ctx, g.body, 'source-over'); }
  put(ctx, surface, 'multiply');
  for (const g of pads) { put(ctx, g.rim, 'multiply'); put(ctx, g.body, 'source-over'); }
  put(ctx, lotus.rim, 'multiply'); put(ctx, lotus.body, 'source-over');
  put(ctx, splatter, 'multiply');
  drawPaperGrain(ctx);

  window.koiPainting = { pond, koi, pads, lotus, surface, splatter };
  document.body.dataset.done = '1';
}
main();
})();
</script>
</body>
