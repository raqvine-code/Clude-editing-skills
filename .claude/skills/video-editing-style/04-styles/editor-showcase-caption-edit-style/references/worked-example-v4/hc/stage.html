<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: GV; src: url(fonts/GreatVibes-Regular.ttf); }
@font-face { font-family: AR; src: url(fonts/Arimo.ttf); font-weight: 400 700; }
:root {
  --deep: #1E2B26;      /* the dark of his green slats */
  --deeper: #121B17;
  --amber: #E9B86F;     /* his lamp-side glow, lifted */
  --amber-ink: #A9732C; /* the same hue, dark enough for cream paper */
  --cream: #F3EADB;     /* the lit wall, warm white */
  --board: #EEE4D3;
  --sh: 0 6px 18px rgba(0,0,0,.50), 0 1px 3px rgba(0,0,0,.40);
}
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#stage { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
.full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
#cardwrap { position: absolute; overflow: hidden; }
#main { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
.plate { position: absolute; inset: 0; display: none; }
.shade { position: absolute; left: 0; right: 0; bottom: 0; height: 900px; background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.50)); }
.cap { position: absolute; left: 0; width: 1080px; display: none; text-align: center; pointer-events: none; }
.line { display: block; white-space: nowrap; font-size: 0; }
.w { display: inline-block; will-change: filter, opacity, transform; margin-right: .27em; }
.w:last-child { margin-right: 0; }
/* script glyphs overhang their box (swash capitals, tails, descenders): give them room so the write-on mask never clips them */
.w.script { padding: .22em .36em .34em; margin: -.22em -.09em -.34em -.36em; }
.w.script:last-child { margin-right: -.36em; }
.small { font: 400 56px/1.12 AR; color: rgba(255,255,255,.96); text-shadow: var(--sh); letter-spacing: .1px; }
.key { font: 700 124px/1.0 AR; color: var(--amber); letter-spacing: -2.5px; text-shadow: 0 0 26px rgba(233,184,111,.32), 0 6px 16px rgba(0,0,0,.50); }
.white { font: 700 96px/1.0 AR; color: #fff; letter-spacing: -2px; text-shadow: var(--sh); }
.script { font: 400 170px/1.0 GV; color: #fff; text-shadow: 0 8px 22px rgba(0,0,0,.55), 0 2px 4px rgba(0,0,0,.35); }
.bold { font: 700 72px/1.1 AR; color: #fff; letter-spacing: -1.2px; text-shadow: var(--sh); }
.onpaper .small { color: rgba(30,43,38,.86); text-shadow: none; }
.onpaper .key { color: var(--amber-ink); text-shadow: none; }
.onpaper .script { color: var(--deep); text-shadow: none; }
.pill { position: absolute; height: 100px; border-radius: 50px; background: #15201C; box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 0 0 1.5px rgba(233,184,111,.28);
        display: flex; align-items: center; overflow: hidden; }
.pill .glow { position: absolute; left: -40px; top: -30px; width: 220px; height: 150px; background: radial-gradient(closest-side, rgba(233,184,111,.65), rgba(233,184,111,0)); }
.pill .ic { position: relative; width: 58px; height: 58px; margin: 0 18px 0 17px; border-radius: 50%; border: 2.5px solid var(--amber); flex: none; }
.pill .tx { position: relative; font: 700 43px/1 AR; letter-spacing: 1.2px; color: var(--cream); white-space: nowrap; padding-right: 36px; }
.card { position: absolute; overflow: hidden; border-radius: 40px; box-shadow: 0 30px 60px rgba(0,0,0,.30), 0 6px 14px rgba(0,0,0,.20); }
.card img { position: absolute; }
.film { position: absolute; height: 330px; display: flex; gap: 0; }
.fr { position: relative; width: 236px; height: 330px; background: #1A2420; margin-right: 10px; border-radius: 6px; overflow: hidden; }
.fr img { position: absolute; left: 14px; top: 36px; width: 208px; height: 258px; object-fit: cover; border-radius: 3px; }
.fr .holes { position: absolute; left: 10px; right: 10px; height: 16px; background: repeating-linear-gradient(90deg, var(--cream) 0 16px, transparent 16px 30px); border-radius: 3px; opacity: .85; }
.box { position: absolute; font: 400 40px/1 AR; color: var(--cream); background: rgba(18,27,23,.78); padding: 16px 26px; border-radius: 14px; white-space: nowrap; box-shadow: 0 8px 22px rgba(0,0,0,.35); }
</style></head>
<body><div id="stage">
  <div id="cardwrap"><img id="main"></div>
  <img id="broll" class="full" style="display:none; object-fit: cover;">
  <div id="fx" class="full" style="pointer-events:none"></div>
</div>
<script src="engine.js"></script>
</body></html>
